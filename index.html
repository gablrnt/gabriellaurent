<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoWhere Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Landing Page -->
  <section class="landing">
    <header>
      <h1 class="logo">GoWhere</h1>
      <div class="header-buttons">
        <button class="sign-in">Se connecter</button>
        <button class="log-in">S'inscrire</button>
      </div>
    </header>

    <div class="hero">
      <h2>Trouve ta prochaine destination facilement.</h2>
      <p>Découvre le monde selon ton humeur, ton budget et tes envies.</p>
      <button class="cta">Commencer l'exploration</button>
    </div>

    <div class="filters">
      <div class="filter-group continents">
        <button class="active">🌍 Europe</button>
        <button>🌎 Amériques</button>
        <button>🌏 Asie</button>
        <button>🌍 Afrique</button>
        <button>🌏 Océanie</button>
      </div>
      <div class="filter-group price">
        <button>€</button>
        <button>€€</button>
        <button>€€€</button>
        <button>€€€€</button>
      </div>
      <div class="filter-group type">
        <button>🧗‍♂️ Aventure</button>
        <button>🏖️ Plage</button>
        <button>🏰 Monuments</button>
        <button>🌆 Ville</button>
        <button>🍜 Gastronomie</button>
      </div>
    </div>
  </section>

  <!-- Swipe Pages -->
  <section class="swipe">
    <div class="swipe-image" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');"></div>
    <div class="bottom-bar">
      <button>⭐️</button>
      <button>❤️</button>
      <button>❌</button>
      <button>🚫</button>
    </div>
  </section>

  <!-- Results Page -->
  <section class="results">
    <h2>Tes meilleures correspondances 🌍</h2>
    <div class="cards">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1533762374573-2785e3cf6f6a" alt="Amsterdam">
        <h3>Amsterdam</h3>
        <p>💰4/5 🌅3/5 🍽️3/5 🎉5/5</p>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1505761671935-60b3a7427bad" alt="Tokyo">
        <h3>Tokyo</h3>
        <p>💰3/5 🌅5/5 🍽️5/5 🎉4/5</p>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" alt="Barcelona">
        <h3>Barcelone</h3>
        <p>💰4/5 🌅4/5 🍽️4/5 🎉5/5</p>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1534927397128-96351ee7b84a" alt="Reykjavik">
        <h3>Reykjavik</h3>
        <p>💰3/5 🌅5/5 🍽️4/5 🎉3/5</p>
      </div>
    </div>
  </section>
</body>
</html>
